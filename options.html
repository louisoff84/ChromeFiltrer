<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChromeFiltrer — Options</title><link rel="stylesheet" href="style.css"></head><body><main class="options"><h1>ChromeFiltrer</h1><h2>Filtres avancés</h2><label class="row"><span>Masquer les bannières cookies</span><input id="hideCookieBanners" type="checkbox"></label><label>Mots bloqués <span class="muted">(un par ligne)</span><textarea id="blockedWords" rows="8" placeholder="casino&#10;contenu indésirable"></textarea></label><label>Sélecteurs CSS personnalisés <span class="muted">(un par ligne)</span><textarea id="customSelectors" rows="8" placeholder=".ma-classe&#10;#mon-element"></textarea></label><div class="actions"><button id="save">Enregistrer</button><button id="reset" class="secondary">Réinitialiser</button></div><p id="status"></p><p class="muted">Tout le filtrage s'effectue directement dans le navigateur. Aucun serveur externe n'est utilisé.</p></main><script src="options.js"></script></body></html>
