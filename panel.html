<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChromeFiltrer v3</title><link rel="stylesheet" href="panel.css"></head><body><aside><h1>ChromeFiltrer</h1><b>Low RAM v3</b><nav><button data-page="dashboard">Dashboard</button><button data-page="ram">RAM Saver</button><button data-page="filters">Filtres</button><button data-page="sites">Sites</button><button data-page="backup">Sauvegarde</button><button data-page="diagnostics">Diagnostic</button></nav></aside><main><header><div><h2 id="pageTitle">Dashboard</h2><p class="muted">Tout est géré localement.</p></div><button id="global">Protection</button></header><section id="dashboard" class="page"><div class="hero"><div><strong id="statusText">Protection active</strong><p>Mode optimisé pour les petits PC.</p></div><button id="optimizeNow">Optimiser maintenant</button></div><div class="cards"><article><small>Éléments bloqués</small><strong id="total">0</strong></article><article><small>Onglets suspendus</small><strong id="discarded">0</strong></article><article><small>Profil</small><strong id="profileName">4 Go</strong></article></div><h3>Réglage rapide</h3><div class="profiles"><button data-profile="4gb">PC 4 Go</button><button data-profile="8gb">PC 8 Go</button><button data-profile="normal">Normal</button></div><h3>Sites les plus filtrés</h3><div id="topSites"></div></section><section id="ram" class="page hidden"><h2>RAM Saver</h2><div id="ramSettings"></div><label class="field">Suspendre un onglet après <select id="suspendMinutes"><option value="2">2 minutes</option><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="20">20 minutes</option><option value="30">30 minutes</option></select></label><button id="saveRam">Enregistrer</button></section><section id="filters" class="page hidden"><h2>Allègement des pages</h2><div id="filterSettings"></div><label>Mots bloqués<textarea id="blockedWords" placeholder="Un mot par ligne"></textarea></label><label>Sélecteurs CSS personnalisés<textarea id="customSelectors" placeholder="Un sélecteur par ligne"></textarea></label><button id="saveFilters">Enregistrer</button></section><section id="sites" class="page hidden"><h2>Sites</h2><label>Ne jamais filtrer<textarea id="whitelist" placeholder="exemple.fr"></textarea></label><button id="saveSites">Enregistrer</button></section><section id="backup" class="page hidden"><h2>Sauvegarde</h2><button id="export">Exporter la configuration</button><textarea id="importData" placeholder="Collez ici une sauvegarde JSON"></textarea><button id="import">Importer</button><button id="reset" class="danger">Réinitialiser ChromeFiltrer</button></section><section id="diagnostics" class="page hidden"><h2>Diagnostic</h2><pre id="diag"></pre><button id="refreshDiag">Actualiser</button></section><div id="toast"></div></main><script src="panel.js"></script></body></html>
