<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChromeFiltrer Panel</title><link rel="stylesheet" href="panel.css"></head><body><aside><h1>ChromeFiltrer</h1><b>Local Panel v2</b><nav><button data-page="dashboard">Dashboard</button><button data-page="filters">Filtres</button><button data-page="rules">Règles</button><button data-page="sites">Sites</button><button data-page="profiles">Profils</button><button data-page="stats">Statistiques</button><button data-page="backup">Sauvegarde</button><button data-page="diagnostics">Diagnostic</button></nav></aside><main><header><input id="search" placeholder="Rechercher un réglage…"><button id="global">Protection</button></header><section id="dashboard" class="page"><h2>Dashboard</h2><div class="cards"><article><small>Éléments bloqués</small><strong id="total">0</strong></article><article><small>Sites configurés</small><strong id="siteCount">0</strong></article><article><small>Règles perso</small><strong id="ruleCount">0</strong></article></div><h3>Sites les plus filtrés</h3><div id="topSites"></div></section><section id="filters" class="page hidden"><h2>Filtres</h2><div id="toggles"></div></section><section id="rules" class="page hidden"><h2>Règles personnalisées</h2><label>Mots bloqués<textarea id="blockedWords"></textarea></label><label>Sélecteurs CSS<textarea id="customSelectors"></textarea></label><button id="saveRules">Enregistrer</button></section><section id="sites" class="page hidden"><h2>Gestion des sites</h2><label>Whitelist<textarea id="whitelist"></textarea></label><label>Blacklist<textarea id="blacklist"></textarea></label><button id="saveSites">Enregistrer</button></section><section id="profiles" class="page hidden"><h2>Profils</h2><div class="profiles"><button data-mode="light">Léger</button><button data-mode="normal">Normal</button><button data-mode="strict">Strict</button></div><p id="modeText"></p></section><section id="stats" class="page hidden"><h2>Statistiques locales</h2><div id="statsTable"></div><button id="clearStats" class="danger">Effacer les statistiques</button></section><section id="backup" class="page hidden"><h2>Sauvegarde</h2><button id="export">Exporter JSON</button><textarea id="importData" placeholder="Collez une sauvegarde JSON ici"></textarea><button id="import">Importer</button><button id="reset" class="danger">Réinitialiser les réglages</button></section><section id="diagnostics" class="page hidden"><h2>Diagnostic</h2><pre id="diag"></pre><button id="refreshDiag">Actualiser</button></section><div id="toast"></div></main><script src="panel.js"></script></body></html>
